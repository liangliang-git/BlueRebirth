name: CI

on:
  push:
    branches: [master, WakabaMutsumi]
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust format
        run: cargo fmt --manifest-path rust-server/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path rust-server/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path rust-server/Cargo.toml --workspace

      - name: Restore .NET support tools
        run: dotnet restore BlueOath.Local.sln

      - name: Build .NET support tools
        run: dotnet build BlueOath.Local.sln -c Release --no-restore
