[workspace]
members = [
    "crates/transport",
    "crates/server",
    "crates/storage",
    "crates/protocol",
    "crates/domain",
    "crates/game",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
